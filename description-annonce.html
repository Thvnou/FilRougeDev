<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ymmo</title>
    <link rel="stylesheet" href="css/description-annonce.css" />
  </head>

  <body>
    <!-- Barre de navigation de la page -->
    <section class="top-page">
      <div class="info">
        <p>12 agences sur toute la France</p>
      </div>
      <nav class="nav-top-page">
        <li id="nav-agences">Nos agences</li>
        <li id="nav-favoris">Mes favoris</li>
        <li id="nav-compte">Mon compte</li>
      </nav>
    </section>

    <!-- Barre menu -->
    <header class="menu">
      <img src="images/Logo.png" alt="logo du site" class="logo-barre-menu" />
      <div class="info-utilisateur">
        <h1>YMMO Agence</h1>
        <h3>visiteur</h3>
      </div>
    </header>

    <!-- Bouton retour -->
    <a href="annonces.html" class="btn-retour">&#8592; Retour aux annonces</a>

    <!-- Description de l'annonce -->
    <section class="detail-annonce">

      <div class="detail-gauche">
        <div class="detail-photo">
          <img id="detail-img" src="images/appart/appart-1.jpeg" alt="photo du bien" />
        </div>
        <div class="detail-bas">
          <span class="reference" id="detail-ref">Réf. —</span>
          <button class="btn-favori-detail" id="btn-favori-detail">☆ Ajouter aux favoris</button>
          <button class="btn-candidature">J'envoie ma candidature</button>
        </div>
      </div>

      <div class="detail-droite">
        <div class="detail-info">
          <div class="info-ligne">
            <span class="info-label">Type de bien</span>
            <span class="info-valeur" id="detail-type">—</span>
          </div>
          <div class="info-ligne">
            <span class="info-label">Catégorie</span>
            <span class="info-valeur" id="detail-category">—</span>
          </div>
          <div class="info-ligne">
            <span class="info-label">Ville</span>
            <span class="info-valeur" id="detail-city">—</span>
          </div>
          <div class="info-ligne">
            <span class="info-label">Superficie</span>
            <span class="info-valeur" id="detail-area">—</span>
          </div>
          <div class="info-ligne">
            <span class="info-label">Prix</span>
            <span class="info-valeur" id="detail-price">—</span>
          </div>
          <div class="info-ligne">
            <span class="info-label">Nb de pièces</span>
            <span class="info-valeur" id="detail-rooms">—</span>
          </div>
          <div class="info-ligne">
            <span class="info-label">Score énergétique</span>
            <span class="info-valeur">C</span>
          </div>
        </div>
      </div>

    </section>

    <script src="js/config.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/properties.js"></script>
    <script src="js/header.js"></script>
    <script src="js/description-annonce.js"></script>
  </body>
</html>

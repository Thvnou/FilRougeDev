<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ymmo</title>
    <link rel="stylesheet" href="css/description-annonce.css" />
  </head>

  <body>
    <!-- Barre de navigation de la page -->
    <section class="top-page">
      <div class="info">
        <p>12 agences sur toute la France</p>
      </div>
      <nav class="nav-top-page">
        <li>Nos agences</li>
        <li>Mes favoris</li>
        <li>Mon compte</li>
      </nav>
    </section>

    <!-- Barre menu -->
    <header class="menu">
      <img src="images/Logo.png" alt="logo du site" class="logo-barre-menu" />
      <div class="info-utilisateur">
        <h1>YMMO Agence</h1>
        <h3>visiteur</h3>
      </div>
    </header>

    <!-- Bouton retour -->
    <a href="annonces.html" class="btn-retour">&#8592; Retour aux annonces</a>

    <!-- Description de l'annonce -->
    <section class="detail-annonce">

      <div class="detail-gauche">
        <div class="detail-photo">
          <img id="detail-img" src="images/appart/appart-1.jpeg" alt="photo du bien" />
        </div>
        <div class="detail-bas">
          <span class="reference" id="detail-ref">Réf. —</span>
          <button class="btn-candidature">J'envoie ma candidature</button>
        </div>
      </div>

      <div class="detail-droite">
        <div class="detail-info">
          <div class="info-ligne">
            <span class="info-label">Type de bien</span>
            <span class="info-valeur" id="detail-type">—</span>
          </div>
          <div class="info-ligne">
            <span class="info-label">Catégorie</span>
            <span class="info-valeur" id="detail-category">—</span>
          </div>
          <div class="info-ligne">
            <span class="info-label">Ville</span>
            <span class="info-valeur" id="detail-city">—</span>
          </div>
          <div class="info-ligne">
            <span class="info-label">Superficie</span>
            <span class="info-valeur" id="detail-area">—</span>
          </div>
          <div class="info-ligne">
            <span class="info-label">Prix</span>
            <span class="info-valeur" id="detail-price">—</span>
          </div>
          <div class="info-ligne">
            <span class="info-label">Nb de pièces</span>
            <span class="info-valeur" id="detail-rooms">—</span>
          </div>
          <div class="info-ligne">
            <span class="info-label">Score énergétique</span>
            <span class="info-valeur">C</span>
          </div>
        </div>
      </div>

    </section>

    <script>
      const params = new URLSearchParams(window.location.search);
      const img = params.get('img');
      const id  = params.get('id');

      // 1. Affiche immédiatement la photo transmise depuis la page annonces
      if (img) {
        document.getElementById('detail-img').src = img;
      }

      // 2. Récupère les données texte du bien depuis l'API
      if (id) {
        fetch(`http://localhost:8000/api/properties/${id}`)
          .then(res => res.json())
          .then(p => {
            document.getElementById('detail-ref').textContent      = `Réf. ${String(p.id).padStart(5, '0')}`;
            document.getElementById('detail-type').textContent     = p.type;
            document.getElementById('detail-category').textContent = p.category;
            document.getElementById('detail-city').textContent     = p.city;
            document.getElementById('detail-area').textContent     = `${p.area} m²`;
            document.getElementById('detail-price').textContent    = `${p.price.toLocaleString('fr-FR')} €`;
            document.getElementById('detail-rooms').textContent    = p.rooms;
          })
          .catch(() => console.error('Impossible de charger les données du bien'));
      }
    </script>

  </body>
</html>

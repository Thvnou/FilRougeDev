<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ymmo — Messages</title>
    <link rel="stylesheet" href="css/messages.css" />
  </head>

  <body>
    <!-- Barre de navigation -->
    <section class="top-page">
      <div class="info">
        <p>12 agences sur toute la France</p>
      </div>
      <nav class="nav-top-page">
        <li id="nav-accueil">Accueil</li>
        <li id="nav-agences">Nos agences</li>
        <li id="nav-favoris">Mes favoris</li>
        <li id="nav-compte">Mon compte</li>
      </nav>
    </section>

    <!-- Barre menu -->
    <header class="menu">
      <img src="images/Logo.png" alt="logo du site" class="logo-barre-menu" />
      <div class="info-utilisateur">
        <h1>Nom Prénom</h1>
        <h3>Client</h3>
      </div>
      <button class="btn-deconnexion">Déconnexion</button>
    </header>

    <!-- Contenu principal -->
    <main class="messages-wrapper">

      <div class="messages-header">
        <a href="compte-client.html" class="btn-retour">&#8592; Retour</a>
        <h2 class="messages-titre">Mes messages</h2>
      </div>


      <!-- Liste des conversations -->
      <ul class="conversations-liste">
        <li><p>Chargement de vos conversations...</p></li>
      </ul>
    </main>

    <script src="js/config.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/header.js"></script>
    <script src="js/messages.js"></script>
  </body>
</html>

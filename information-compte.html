<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Compte Client Ymmo</title>
    <link rel="stylesheet" href="css/information-compte.css" />
  </head>

  <body>
    <!-- Barre de navigation de la page -->
    <section class="top-page">
      <div class="info">
        <p>12 agences sur toute la France</p>
      </div>
      <nav class="nav-top-page">
        <li id="nav-accueil">Accueil</li>
        <li id="nav-agences">Nos agences</li>
        <li id="nav-favoris">Mes favoris</li>
        <li id="nav-compte">Mon compte</li>
      </nav>
    </section>

    <!-- Barre menu -->
    <header class="menu">
      <img src="images/Logo.png" alt="logo du site" class="logo-barre-menu" />

      <div class="info-utilisateur">
        <h1>Nom Prénom</h1>
        <h3>Client</h3>
      </div>

      <button class="btn-deconnexion">Déconnexion</button>
    </header>

    <!-- Bouton retour -->
    <a href="compte-client.html" class="btn-retour">&#8592; Retour</a>

    <!-- Profil utilisateur -->
    <section class="profil">

      <div class="profil-infos">
        <div class="profil-champs">
          <div class="colonne">
            <p><span class="label">Nom :</span> <span class="valeur" id="profil-nom">—</span></p>
            <p><span class="label">Prénom :</span> <span class="valeur" id="profil-prenom">—</span></p>
          </div>
          <div class="colonne">
            <p><span class="label">Email :</span> <span class="valeur" id="profil-email">—</span></p>
            <p><span class="label">Mot de passe :</span> <span class="valeur">••••••••</span></p>
          </div>
        </div>
        <div class="profil-actions">
          <button class="btn-modifier">Modifier</button>
          <button class="btn-supprimer">Supprimer</button>
        </div>
      </div>

    </section>

    <script src="js/config.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/header.js"></script>
    <script src="js/information-compte.js"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ymmo</title>
    <link rel="stylesheet" href="css/creation-compte.css" />
  </head>

  <body>
    <!-- Barre de navigation de la page -->
    <section class="top-page">
      <div class="info">
        <p>12 agences sur toute la France</p>
      </div>
      <nav class="nav-top-page">
        <li>Nos agences</li>
        <li>Mes favoris</li>
        <li>Mon compte</li>
      </nav>
    </section>

    <!-- Barre menu -->
    <header class="menu">
      <img src="images/Logo.png" alt="logo du site" class="logo-barre-menu" />

      <div class="info-utilisateur">
        <!-- texte qui devra cahnger en fonction du statu de l'utilisateur  -->
        <h1>YMMO Agence</h1>

        <!-- info qui devra changer en compte client quand l'utilisateur se connectera -->
        <h3>visiteur</h3>
      </div>
    </header>

    <section class="page-inscription">
  <div class="formulaire-inscription">
    <h2>Je crée mon compte</h2>
    <input type="text" placeholder="Nom" />
    <input type="text" placeholder="Prénom" />
    <input type="tel" placeholder="Téléphone" />
    <input type="email" placeholder="Email" />
    <input type="password" placeholder="Mot de passe" />
    <input type="password" placeholder="Confirmer mot de passe" />
    <button class="bouton-valider">Valider</button>
  </div>
</section>
  </body>
</html>

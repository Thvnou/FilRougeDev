<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ymmo</title>
    <link rel="stylesheet" href="css/creation-compte.css" />
  </head>

  <body>
    <!-- Barre de navigation de la page -->
    <section class="top-page">
      <div class="info">
        <p>12 agences sur toute la France</p>
      </div>
      <nav class="nav-top-page">
        <li id="nav-accueil">Accueil</li>
        <li id="nav-agences">Nos agences</li>
        <li id="nav-favoris">Mes favoris</li>
        <li id="nav-compte">Mon compte</li>
      </nav>
    </section>

    <!-- Barre menu -->
    <header class="menu">
      <img src="images/Logo.png" alt="logo du site" class="logo-barre-menu" />

      <div class="info-utilisateur">
        <!-- texte qui devra cahnger en fonction du statu de l'utilisateur  -->
        <h1>YMMO Agence</h1>

        <!-- info qui devra changer en compte client quand l'utilisateur se connectera -->
        <h3>visiteur</h3>
      </div>
    </header>

    <section class="page-inscription">
  <div class="formulaire-inscription">
    <h2>Je crée mon compte</h2>
    <p id="creation-error" class="message-erreur" style="display:none;"></p>
    <input type="text" id="lastname" placeholder="Nom" />
    <input type="text" id="firstname" placeholder="Prénom" />
    <input type="tel" id="phone" placeholder="Téléphone" />
    <input type="email" id="email" placeholder="Email" />
    <input type="password" id="password" placeholder="Mot de passe" />
    <input type="password" id="confirm-password" placeholder="Confirmer mot de passe" />
    <button class="bouton-valider" type="button">Valider</button>
  </div>
</section>

    <script src="js/config.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/header.js"></script>
    <script src="js/creation-compte.js"></script>
  </body>
</html>

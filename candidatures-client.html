<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Compte Client Ymmo</title>
    <link rel="stylesheet" href="css/candidatures-client.css" />
  </head>

  <body>
    <!-- Barre de navigation de la page -->
    <section class="top-page">
      <div class="info">
        <p>12 agences sur toute la France</p>
      </div>
      <nav class="nav-top-page">
        <li id="nav-agences">Nos agences</li>
        <li id="nav-favoris">Mes favoris</li>
        <li id="nav-compte">Mon compte</li>
      </nav>
    </section>

    <!-- Barre menu -->
    <header class="menu">
      <img src="images/Logo.png" alt="logo du site" class="logo-barre-menu" />

      <div class="info-utilisateur">
        <h1>Nom Prénom</h1>
        <h3>Client</h3>
      </div>

      <button class="btn-deconnexion">Déconnexion</button>
    </header>

    <!-- Bouton retour -->
    <a href="compte-client.html" class="btn-retour">&#8592; Retour</a>

    <!-- Mes candidatures -->
    <section class="candidatures">

      <div class="candidatures-header">
        <span class="candidatures-titre">Mes candidatures :</span>
        <div class="candidatures-tabs">
          <button class="tab active">Résidentiel</button>
          <button class="tab">Professionnel</button>
        </div>
      </div>

      <div class="annonces-grid">
        <p>Chargement de vos candidatures...</p>
      </div>

    </section>

    <script src="js/config.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/properties.js"></script>
    <script src="js/header.js"></script>
    <script src="js/candidatures-client.js"></script>

  </body>
</html>

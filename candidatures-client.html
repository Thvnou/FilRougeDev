<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Compte Client Ymmo</title>
    <link rel="stylesheet" href="css/candidatures-client.css" />
  </head>

  <body>
    <!-- Barre de navigation de la page -->
    <section class="top-page">
      <div class="info">
        <p>12 agences sur toute la France</p>
      </div>
      <nav class="nav-top-page">
        <li>Nos agences</li>
        <li>Mes favoris</li>
        <li>Mon compte</li>
      </nav>
    </section>

    <!-- Barre menu -->
    <header class="menu">
      <img src="images/Logo.png" alt="logo du site" class="logo-barre-menu" />

      <div class="info-utilisateur">
        <h1>Nom Prénom</h1>
        <h3>Client</h3>
      </div>

      <button class="btn-deconnexion">Déconnexion</button>
    </header>

    <!-- Bouton retour -->
    <a href="compte-client.html" class="btn-retour">&#8592; Retour</a>

    <!-- Mes candidatures -->
    <section class="candidatures">

      <div class="candidatures-header">
        <span class="candidatures-titre">Mes candidatures :</span>
        <div class="candidatures-tabs">
          <button class="tab active">Résidentiel</button>
          <button class="tab">Professionnel</button>
        </div>
      </div>

      <div class="annonces-grid">
        <div class="annonce-card">
          <div class="annonce-photo">
            <img src="images/appart/appart-1.jpeg" alt="" />
          </div>
          <div class="annonce-prix-statut">
            <span class="prix">250 000 € <small>par mois</small></span>
            <span class="statut">À vendre</span>
          </div>
          <div class="annonce-info">
            <span class="ville">Blois — Centre-ville</span>
            <span class="superficie">36 m²</span>
          </div>
        </div>

        <div class="annonce-card">
          <div class="annonce-photo">
            <img src="images/appart/appart-2.jpeg" alt="appartement 1" />
          </div>
          <div class="annonce-prix-statut">
            <span class="prix">1500 € <small>par mois</small></span>
            <span class="statut">LOCATION</span>
          </div>
          <div class="annonce-info">
            <span class="ville">Senones</span>
            <span class="superficie">29 m²</span>
          </div>
        </div>

    </section>

    <script>
      document.querySelectorAll('.tab').forEach(tab => {
        tab.addEventListener('click', () => {
          document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
          tab.classList.add('active');
        });
      });
    </script>

  </body>
</html>

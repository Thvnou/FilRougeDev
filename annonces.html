<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ymmo</title>
    <link rel="stylesheet" href="css/annonces.css" />
  </head>

  <body>
    <!-- Barre de navigation de la page -->
    <section class="top-page">
      <div class="info">
        <p>12 agences sur toute la France</p>
      </div>
      <nav class="nav-top-page">
        <li id="nav-agences">Nos agences</li>
        <li id="nav-favoris">Mes favoris</li>
        <li id="nav-compte">Mon compte</li>
      </nav>
    </section>

    <!-- Barre menu -->
    <header class="menu">
      <img src="images/Logo.png" alt="logo du site" class="logo-barre-menu" />

      <div class="info-utilisateur">
        <h1>YMMO Agence</h1>
        <h3>visiteur</h3>
      </div>
    </header>

    <!-- Toutes les annonces -->
    <section class="all-annonces">
      <h3>Nos annonces</h3>
      <div class="barre-recherche">
        <div class="formulaire-recherche">
          <select>
            <option value="acheter">Acheter</option>
            <option value="louer">Louer</option>
          </select>
          <input type="text" placeholder="Où cherchez vous ?" />
          <input type="text" placeholder="budget max" />
          <input type="text" placeholder="m2 Minimum" />
        </div>
        <button class="bouton-trier">Trier</button>
      </div>

      <!-- Grille des annonces : générée dynamiquement par js/annonces.js -->
      <div class="annonces-grid">
        <p>Chargement des annonces...</p>
      </div>
    </section>

    <script src="js/config.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/properties.js"></script>
    <script src="js/header.js"></script>
    <script src="js/annonces.js"></script>
  </body>
</html>

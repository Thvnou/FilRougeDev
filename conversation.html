<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ymmo — Conversation</title>
    <link rel="stylesheet" href="css/conversation.css" />
  </head>

  <body>
    <!-- Barre de navigation -->
    <section class="top-page">
      <div class="info">
        <p>12 agences sur toute la France</p>
      </div>
      <nav class="nav-top-page">
        <li id="nav-accueil">Accueil</li>
        <li id="nav-agences">Nos agences</li>
        <li id="nav-favoris">Mes favoris</li>
        <li id="nav-compte">Mon compte</li>
      </nav>
    </section>

    <!-- Barre menu -->
    <header class="menu">
      <img src="images/Logo.png" alt="logo du site" class="logo-barre-menu" />
      <div class="info-utilisateur">
        <h1>Nom Prénom</h1>
        <h3>Client</h3>
      </div>
      <button class="btn-deconnexion">Déconnexion</button>
    </header>

    <!-- Fil de conversation -->
    <main class="conv-wrapper">

      <!-- En-tête de la conversation -->
      <div class="conv-entete">
        <a href="messages.html" class="btn-retour">&#8592; Messages</a>
        <div class="conv-contact">
          <div class="contact-avatar">MA</div>
          <div class="contact-info">
            <span class="contact-nom">Marie Angers</span>
            <span class="contact-detail">Agent — Appartement Paris 11e</span>
          </div>
        </div>
      </div>

      <!-- Messages -->
      <div class="messages-fil">
        <p>Chargement de la conversation...</p>
      </div>

      <!-- Zone de saisie -->
      <form class="saisie-form">
        <textarea
          class="saisie-input"
          placeholder="Écrire un message..."
          rows="1"
        ></textarea>
        <button type="submit" class="btn-envoyer">Envoyer</button>
      </form>

    </main>

    <script src="js/config.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/header.js"></script>
    <script src="js/conversation.js"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ymmo</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <!-- Barre de navigation de la page -->
    <section class="top-page">
        <div class="info">
            <p>12 agences sur toute la France</p>
        </div>
      <nav class="nav-top-page">
        <li>Nos agences</li>
        <li>Mes favoris</li>
        <li>Mon compte</li>
      </nav>
    </section>

    <!-- Barre menu -->
    <header class="menu">
      <img src="images/Logo.png" alt="logo du site" class="logo-barre-menu" />

      <div class="info-utilisateur">
        <!-- texte qui devra cahnger en fonction du statu de l'utilisateur  -->
        <h1>YMMO Agence</h1>

        <!-- info qui devra changer en compte client quand l'utilisateur se connectera -->
        <h3>visiteur</h3>
      </div>

      <!-- bouton pour acceder au candidature -->
      <button class="bouton-mes-candidatures">Mes candidatures</button>
    </header>

<!-- corps de la page d'accueil -->
    <section class="barre-recherche-fond">
      <section class="barre-recherche">
        <div class="onglets-acheter-vendre">
          <button class="bouton-acheter">Acheter</button>
          <button class="bouton-vendre">Vendre</button>
        </div>
        <div class="formulaire-recherche">
          <input type="text" placeholder="Où cherchez vous ?" />
          <input type="number" placeholder="Budget" />
          <input type="number" placeholder="Surface min (m2)" />
        </div>
        <div class="div-bouton-recherche">
          <button class="bouton-recherche">Rechercher</button>
        </div>
      </section>
    </section>


    <!-- Derniers biens publiés -->

    <section class="barre-infos-agence">
      <img src="images/detail-ymmo.png" alt="informations à propos de l'agence">
    </section>

    <section class="derniers-biens">
      <h2>Les derniers biens publiés</h2>

      <div class="liste-biens">

        <div class="carte-bien">
          <img src="images/appart/appart-1.jpeg" alt="Photo du bien" />
          <div class="infos-bien">
            <div class="infos-principales">
              <span class="prix">250 000 €</span>
              <span class="statut">À vendre</span>
            </div>
            <div class="infos-secondaires">
              <span class="ville">Paris</span>
              <span class="superficie">120 m²</span>
            </div>
          </div>
        </div>

        <div class="carte-bien">
          <img src="images/appart/appart-2.jpeg" alt="Photo du bien" />
          <div class="infos-bien">
            <div class="infos-principales">
              <span class="prix">1500 €/mois</span>
              <span class="statut">À louer</span>
            </div>
            <div class="infos-secondaires">
              <span class="ville">Lyon</span>
              <span class="superficie">65 m²</span>
            </div>
          </div>
        </div>

        <div class="carte-bien">
          <img src="images/appart/appart-3.jpeg" alt="Photo du bien" />
          <div class="infos-bien">
            <div class="infos-principales">
              <span class="prix">380 000 €</span>
              <span class="statut">À vendre</span>
            </div>
            <div class="infos-secondaires">
              <span class="ville">Bordeaux</span>
              <span class="superficie">90 m²</span>
            </div>
          </div>
        </div>

      </div>

      <a href="biens.html" class="lien-tous-biens">Voir tous nos biens</a>
    </section>
    <script src="script.js"></script>
  </body>
</html>

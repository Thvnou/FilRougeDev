<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ymmo — Mes favoris</title>
    <link rel="stylesheet" href="css/biens-favoris.css" />
  </head>

  <body>
    <!-- Barre de navigation de la page -->
    <section class="top-page">
      <div class="info">
        <p>12 agences sur toute la France</p>
      </div>
      <nav class="nav-top-page">
        <li id="nav-accueil">Accueil</li>
        <li id="nav-agences">Nos agences</li>
        <li id="nav-favoris">Mes favoris</li>
        <li id="nav-compte">Mon compte</li>
      </nav>
    </section>

    <!-- Barre menu -->
    <header class="menu">
      <img src="images/Logo.png" alt="logo du site" class="logo-barre-menu" />

      <div class="info-utilisateur">
        <h1>YMMO Agence</h1>
        <h3>visiteur</h3>
      </div>
    </header>

    <!-- Mes biens favoris -->
    <section class="all-annonces favoris-section">
      <h3>Mes biens favoris</h3>

      <!-- Grille des favoris : générée dynamiquement par js/biens-favoris.js -->
      <div class="annonces-grid">
        <p>Chargement de vos favoris...</p>
      </div>
    </section>

    <script src="js/config.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/properties.js"></script>
    <script src="js/header.js"></script>
    <script src="js/biens-favoris.js"></script>
  </body>
</html>
